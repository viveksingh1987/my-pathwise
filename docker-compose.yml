services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roadmap
      POSTGRES_PASSWORD: roadmap
      POSTGRES_DB: roadmap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmap"]
      interval: 3s
      retries: 20
  web:
    build: .
    environment:
      STORAGE: postgres        # change to "file" to store everything in ./data/plan.json instead
      DATABASE_URL: postgresql://roadmap:roadmap@db:5432/roadmap
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
